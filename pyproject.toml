[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagewright"
version = "0.1.0"
description = "A static site generator with its own Markdown parser and template engine, incremental builds, plugins and live reload. No dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ali" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["static site generator", "markdown", "templates", "blog", "ssg"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pagewright = "pagewright.cli:main"

[project.urls]
Homepage = "https://github.com/zeexduaa/pagewright"
Issues = "https://github.com/zeexduaa/pagewright/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagewright = ["scaffold/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
